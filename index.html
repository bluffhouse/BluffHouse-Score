<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Keep the Million — Scorecard</title>
<style>
  :root {
    --gold: #00BF63;
    --gold-light: #00BF63;
    --black: #FFFFFF;
    --grey: #AAAAAA;
    --bg: #000000;
    --card: #111111;
    --border: #333333;
    --danger: #FF6B6B;
    --text-on-card: #FFFFFF;
    --text-on-dark: #FFFFFF;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Georgia, 'Times New Roman', serif;
    background: var(--bg);
    color: var(--black);
    min-height: 100vh;
    padding: 20px 14px 60px;
  }
  .wrap { max-width: 480px; margin: 0 auto; }
  header {
    text-align: center;
    margin-bottom: 20px;
    border-bottom: 2px solid var(--gold);
    padding-bottom: 14px;
  }
  .logo {
    max-width: 260px;
    width: 70%;
    height: auto;
    margin-bottom: 10px;
  }
  h1 {
    font-size: 26px;
    letter-spacing: 1px;
    margin: 0 0 4px;
  }
  .tagline {
    font-size: 12px;
    color: var(--gold);
    letter-spacing: 1.5px;
    font-style: italic;
    text-transform: uppercase;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 16px;
  }
  .card h2 {
    font-size: 15px;
    margin: 0 0 12px;
    color: var(--gold);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .add-row {
    display: flex;
    gap: 8px;
    margin-bottom: 4px;
  }
  input[type="text"] {
    flex: 1;
    font-size: 16px;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-family: inherit;
    background: var(--bg);
  }
  button {
    font-family: inherit;
    cursor: pointer;
    border: none;
    border-radius: 6px;
    padding: 10px 16px;
    font-size: 14px;
    font-weight: bold;
  }
  .btn-gold {
    background: var(--gold);
    color: #fff;
  }
  .btn-gold:active { background: var(--gold-light); }
  .player-list {
    list-style: none;
    margin: 0;
    padding: 0;
  }
  .player-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 4px;
    border-bottom: 1px solid var(--border);
  }
  .player-row:last-child { border-bottom: none; }
  .player-name {
    font-size: 17px;
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--text-on-card);
  }
  .score-badge {
    background: var(--gold);
    color: #fff;
    min-width: 26px;
    text-align: center;
    border-radius: 50%;
    padding: 3px 8px;
    font-size: 14px;
    font-weight: bold;
  }
  .row-actions {
    display: flex;
    gap: 6px;
  }
  .btn-small {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text-on-dark);
    padding: 6px 10px;
    font-size: 16px;
    line-height: 1;
  }
  .btn-remove {
    background: none;
    border: none;
    color: var(--danger);
    font-size: 18px;
    padding: 4px 6px;
  }
  .winner-select {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 12px;
  }
  .winner-chip {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 8px 16px;
    font-size: 15px;
    cursor: pointer;
  }
  .winner-chip.selected {
    background: var(--gold);
    color: #fff;
    border-color: var(--gold);
  }
  .empty-hint {
    color: var(--grey);
    font-size: 14px;
    text-align: center;
    padding: 12px 0;
    font-style: italic;
  }
  .winner-chip {
    color: var(--text-on-dark);
  }
  .footer-actions {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-top: 8px;
  }
  .btn-ghost {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-on-dark);
    font-size: 13px;
    padding: 8px 14px;
  }
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--gold);
    color: #fff;
    padding: 10px 20px;
    border-radius: 20px;
    font-size: 14px;
    font-family: sans-serif;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s;
    z-index: 10;
  }
  .toast.show { opacity: 1; }
  .round-counter {
    text-align: center;
    font-size: 13px;
    color: var(--text-on-dark);
    opacity: 0.6;
    margin-bottom: 10px;
    font-family: sans-serif;
  }
</style>
</head>

    <h1>KEEP THE MILLION</h1>
    <div class="tagline">Scorecard</div>
  </header>

  <div class="card">
    <h2>Jucători</h2>
    <div class="add-row">
      <input type="text" id="nameInput" placeholder="Nume jucător" maxlength="20">
      <button class="btn-gold" id="addBtn">Adaugă</button>
    </div>
  </div>

  <div class="card">
    <h2>Scor</h2>
    <ul class="player-list" id="playerList"></ul>
    <div class="empty-hint" id="emptyHint">Adaugă jucătorii ca să începi.</div>
  </div>

  <div class="card" id="roundCard" style="display:none;">
    <h2>Cine a câștigat runda?</h2>
    <div class="winner-select" id="winnerSelect"></div>
    <button class="btn-gold" id="confirmRoundBtn" style="width:100%;">Confirmă câștigătorul rundei</button>
  </div>

  <div class="round-counter" id="roundCounter"></div>

  <div class="footer-actions">
    <button class="btn-ghost" id="resetScoresBtn">Resetează scorurile</button>
    <button class="btn-ghost" id="resetAllBtn">Șterge tot</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const STORAGE_KEY = 'ktm_scorecard_v1';
  let state = { players: [], round: 0 };
  let pendingWinner = null;

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) state = JSON.parse(raw);
    } catch (e) {}
  }
  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (e) {}
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 1400);
  }

  function render() {
    const list = document.getElementById('playerList');
    const emptyHint = document.getElementById('emptyHint');
    const roundCard = document.getElementById('roundCard');
    const winnerSelect = document.getElementById('winnerSelect');
    const roundCounter = document.getElementById('roundCounter');

    list.innerHTML = '';
    if (state.players.length === 0) {
      emptyHint.style.display = 'block';
    } else {
      emptyHint.style.display = 'none';
    }

    state.players.forEach((p, i) => {
      const li = document.createElement('li');
      li.className = 'player-row';
      li.innerHTML = `
        <span class="player-name">${escapeHtml(p.name)} <span class="score-badge">${p.score}</span></span>
        <span class="row-actions">
          <button class="btn-small" data-action="minus" data-idx="${i}">−</button>
          <button class="btn-small" data-action="plus" data-idx="${i}">+</button>
          <button class="btn-remove" data-action="remove" data-idx="${i}">✕</button>
        </span>
      `;
      list.appendChild(li);
    });

    if (state.players.length >= 2) {
      roundCard.style.display = 'block';
      winnerSelect.innerHTML = '';
      state.players.forEach((p, i) => {
        const chip = document.createElement('div');
        chip.className = 'winner-chip' + (pendingWinner === i ? ' selected' : '');
        chip.textContent = p.name;
        chip.dataset.idx = i;
        chip.addEventListener('click', () => {
          pendingWinner = (pendingWinner === i) ? null : i;
          render();
        });
        winnerSelect.appendChild(chip);
      });
    } else {
      roundCard.style.display = 'none';
    }

    roundCounter.textContent = state.round > 0 ? `Runda curentă: ${state.round + 1}` : '';

    list.querySelectorAll('button[data-action]').forEach(btn => {
      btn.addEventListener('click', () => {
        const idx = parseInt(btn.dataset.idx, 10);
        const action = btn.dataset.action;
        if (action === 'plus') state.players[idx].score++;
        if (action === 'minus') state.players[idx].score = Math.max(0, state.players[idx].score - 1);
        if (action === 'remove') {
          state.players.splice(idx, 1);
          pendingWinner = null;
        }
        save();
        render();
      });
    });
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  document.getElementById('addBtn').addEventListener('click', addPlayer);
  document.getElementById('nameInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') addPlayer();
  });

  function addPlayer() {
    const input = document.getElementById('nameInput');
    const name = input.value.trim();
    if (!name) return;
    state.players.push({ name, score: 0 });
    input.value = '';
    save();
    render();
    input.focus();
  }

  document.getElementById('confirmRoundBtn').addEventListener('click', () => {
    if (pendingWinner === null) {
      showToast('Alege un câștigător mai întâi');
      return;
    }
    state.players[pendingWinner].score++;
    state.round++;
    pendingWinner = null;
    save();
    render();
    showToast('Scor actualizat');
  });

  document.getElementById('resetScoresBtn').addEventListener('click', () => {
    if (!confirm('Resetezi toate scorurile la 0?')) return;
    state.players.forEach(p => p.score = 0);
    state.round = 0;
    save();
    render();
  });

  document.getElementById('resetAllBtn').addEventListener('click', () => {
    if (!confirm('Ștergi toți jucătorii și scorurile?')) return;
    state = { players: [], round: 0 };
    pendingWinner = null;
    save();
    render();
  });

  load();
  render();
</script>
</body>
</html>
